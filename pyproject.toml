[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gwsearch"
version = "0.1.0"
description = "Near-production gravitational-wave CBC search pipeline for GWOSC open data"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
  { name = "GW Search Authors", email = "gwsearch@example.com" }
]
dependencies = [
  "typer[all]>=0.9.0",
  "rich>=13.7.0",

  # NumPy 2 stack
  "numpy>=2.2.0",
  "scipy>=1.14.0",
  "pandas>=2.2.2",
  "h5py>=3.11.0",

  "pyyaml>=6.0.1",
  "requests>=2.31.0",
  "httpx>=0.26.0",
  "tenacity>=8.2.3",
  "cachetools>=5.3.3",
  "filelock>=3.13.0",

  # PyCBC 2.10
  "PyCBC>=2.10.0",

  "gwpy>=3.0.9",
  "astropy>=6.1.0",
  "matplotlib>=3.8.2",

  "fastapi>=0.110.2",
  "uvicorn>=0.29.0",
  "sqlalchemy>=2.0.29",
  "pydantic>=2.6.4",
  "psutil>=5.9.8",
  "orjson>=3.10.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.4",
  "pytest-cov>=4.1.0",
  "ruff>=0.6.0",
  "mypy>=1.9.0",
  "types-requests",
  "types-PyYAML"
]

# İstersen proje ekstra'sı olarak CUDA'yı da böyle tanımlayabilirsin:
cuda = [
  "pycuda>=2025.1.1",
  "scikit-cuda",
  "mako>=1.3.0"
]

[project.scripts]
gwsearch = "gwsearch.cli:main"

[tool.setuptools]
packages = ["gwsearch"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --disable-warnings"
testpaths = ["tests"]

